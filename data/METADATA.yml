transcription-guidelines: >-
  The transcription rules are based on the OCR-D transcription guidelines Level 2
  with some exceptions (see below No. 2):
  1) Special characters:
    - Long s (ſ)
    - R rotunda (ꝛ)
    - Combining latin small letter e ( ͤ)
    - Asterisk (*)
    
  2) Additional characters transcribed true to original (contrary to OCR-D Level 2):
    - Double oblique hyphen (⸗)
    - Em dash (—) instead of En dash (–)
