description: >-
  The original NZZ Black Letter Ground Truth (https://github.com/impresso/NZZ-black-letter-ground-truth) 
  was published in 2019 by Phillip Ströbel and Simon Clematide under CC BY-NC 4.0. The data set contains 
  167 randomly chosen frontpages of the Neue Zürcher Zeitung (NZZ) that were published between 1780 and 1947. 
  The ground truth was produced using Transkribus and it's internal ABBYY FineReader Server 11 with 
  additional manual corrections.

  A revision of the data set was carried out by Mannheim University Library (https://www.bib.uni-mannheim.de/en/)
  from March 2023 to June 2023 using Transkribus. The revision includes: 
  1. Layout correction of text regions, text lines and baselines.
  2. Region labeling ("header", "headings", "paragraphs"). 
  3. Correction and enhancement of transcriptions according to OCR-D Ground Truth Guidelines Level 2 (https://ocr-d.de/en/gt-guidelines/trans/level_2_2.html).
